#Thu Feb 26 13:26:59 UTC 2026
micronaut.application.name=bankservice
aws.dynamodb.table-name=customerregister

micronaut.security.enabled=true
micronaut.security.token.jwt.enabled=true
micronaut.security.token.jwt.signatures.secret.validation.secret=${JWT_SECRET}
micronaut.security.token.jwt.signatures.secret.validation.base64=true

# CORS Configuration
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins=http://localhost:3000
micronaut.server.cors.configurations.web.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
micronaut.server.cors.configurations.web.allow-credentials=true
micronaut.server.cors.configurations.web.max-age=3600
micronaut.server.cors.configurations.web.allowed-headers=Content-Type,Authorization,Accept